# Heap sized for THIS machine (7.9 GB total RAM). The Flutter template default
# of -Xmx8G with 4G metaspace asks for ~12 GB, which cannot be reserved on an
# 8 GB box — the JVM dies with "Native memory allocation (mmap) failed ...
# G1 virtual space" and the build fails with a daemon crash.
# R8 and AOT both fit comfortably in 2 GB for an app this size.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── Network resilience ──────────────────────────────────────────────────────
# On this machine Maven Central and dl.google.com intermittently drop
# concurrent TLS connections ("Remote host terminated the handshake") when
# Gradle fetches many artifacts at once. Retrying with generous timeouts turns
# a hard build failure into a slow, successful one; Gradle keeps everything it
# already downloaded, so each attempt gets further.
org.gradle.internal.repository.max.tentatives=10
org.gradle.internal.repository.initial.backoff=1000
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

# Gradle 9 defaults to HTTP/2 for some repositories, which is what gets
# dropped here. Pinning TLS/HTTP versions avoids the failing negotiation path.
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.protocols=HTTP/1.1

# Fewer concurrent downloads: slower, but far fewer dropped connections.
org.gradle.parallel=false
org.gradle.workers.max=2

